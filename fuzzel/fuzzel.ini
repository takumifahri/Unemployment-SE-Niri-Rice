# FR Navy — fuzzel
[main]
font=Inter:size=11
# ukuran ikut skala output niri, bukan DPI fisik layar (di layar laptop padat teks jadi 2× lebih besar)
dpi-aware=no
prompt="  "
icon-theme=Papirus-Dark
icons-enabled=yes
image-size-ratio=0.5
width=28
lines=6
horizontal-pad=14
vertical-pad=10
inner-pad=6
line-height=22
terminal=alacritty -e

[colors]
