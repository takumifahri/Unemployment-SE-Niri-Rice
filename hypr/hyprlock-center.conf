# FR Navy — hyprlock gaya tengah (dipilih lewat fr-lockstyle)
# Wallpaper: ~/.config/hypr/lock.png (diatur dari panel kontrol → Wallpaper → Lockscreen)
# Catatan: di hyprlock, "##" = karakter "#" (karena "#" itu komentar)

$accent  = rgba(110, 168, 254, 1.0)
$teal    = rgba(127, 209, 185, 1.0)
$text    = rgba(230, 234, 242, 1.0)
$muted   = rgba(230, 234, 242, 0.62)
$surface = rgba(11, 15, 23, 0.55)
$urgent  = rgba(242, 122, 122, 1.0)
$font    = Inter
$fontB   = Inter ExtraBold
$icons   = JetBrainsMono Nerd Font

general {
    hide_cursor = false   # kursor tampil supaya tombol media bisa diklik
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = soft, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 6, soft
    animation = fadeOut, 1, 4, soft
    animation = inputFieldDots, 1, 2, soft
}

background {
    monitor =
    path = ~/.config/hypr/lock.png
    color = rgba(11, 15, 23, 1.0)
    blur_passes = 3
    blur_size = 7
    noise = 0.012
    contrast = 0.95
    brightness = 0.62
    vibrancy = 0.2
}

# ── jam besar: menit diberi warna aksen ─────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H<span foreground='##6EA8FE'>:</span>%M"
    color = $text
    font_size = 132
    font_family = $fontB
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
    position = 0, 250
    halign = center
    valign = center
}

# tanggal
label {
    monitor =
    text = cmd[update:60000] LC_TIME=id_ID.UTF-8 date +"%A, %-d %B %Y"
    color = $muted
    font_size = 19
    font_family = $font
    position = 0, 130
    halign = center
    valign = center
}

# ── kartu login (frosted) ───────────────────────────────
shape {
    monitor =
    size = 360, 250
    color = $surface
    rounding = 28
    border_size = 1
    border_color = rgba(255, 255, 255, 0.08)
    position = 0, -110
    halign = center
    valign = center
}

# avatar: lingkaran + inisial user
shape {
    monitor =
    size = 84, 84
    color = rgba(26, 34, 51, 0.95)
    rounding = -1
    border_size = 2
    border_color = $accent
    position = 0, -40
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] echo "$USER" | cut -c1 | tr '[:lower:]' '[:upper:]'
    color = $accent
    font_size = 32
    font_family = $fontB
    position = 0, -40
    halign = center
    valign = center
}

# foto profil di atas inisial (kalau ~/.face belum ada, inisial yang terlihat)
image {
    monitor =
    path = ~/.face
    size = 84
    rounding = -1
    border_size = 2
    border_color = $accent
    position = 0, -40
    halign = center
    valign = center
}

# sapaan
label {
    monitor =
    text = cmd[update:0] n=$(cat ~/.config/fr-profile/name 2>/dev/null); [ -n "$n" ] || n="$USER"; echo "Halo, $n"
    color = $text
    font_size = 15
    font_family = Inter SemiBold
    position = 0, -108
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 296, 50
    outline_thickness = 2
    rounding = -1
    outer_color = rgba(255, 255, 255, 0.10)
    inner_color = rgba(18, 24, 38, 0.85)
    font_color = $text
    font_family = $font
    check_color = $accent $teal 45deg
    fail_color = $urgent
    capslock_color = rgba(242, 196, 109, 1.0)
    placeholder_text = <span foreground="##8A96AD">Masukkan password…</span>
    fail_text = <span foreground="##F27A7A">Password salah ($ATTEMPTS)</span>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    position = 0, -170
    halign = center
    valign = center
}

# ── status bawah kiri: baterai & wifi ───────────────────
label {
    monitor =
    text = cmd[update:60000] b=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); s=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1); w=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | grep '^yes' | cut -d: -f2); out=""; [ -n "$b" ] && { [ "$s" = "Charging" ] && i="󰂄" || i="󰁹"; out="$i  $b%"; }; [ -n "$w" ] && out="$out     󰖩  $w"; echo "$out"
    color = $muted
    font_size = 13
    font_family = $icons
    position = 40, 36
    halign = left
    valign = bottom
}

# ── bawah kanan: media yang sedang diputar (fr-media, MPRIS) ──
image {
    monitor =
    path = ~/.cache/fr-media/none.png
    reload_cmd = ~/.local/bin/fr-media art
    reload_time = 3
    size = 68
    rounding = 14
    border_size = 0
    position = -40, 36
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:2000] ~/.local/bin/fr-media title
    color = $text
    font_size = 14
    font_family = Inter SemiBold
    position = -124, 82
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:2000] ~/.local/bin/fr-media sub
    color = $muted
    font_size = 11
    font_family = $font
    position = -124, 60
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/fr-media progress
    color = $accent
    font_size = 10
    font_family = $icons
    position = -124, 36
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:2000] ~/.local/bin/fr-media nexticon
    onclick = ~/.local/bin/fr-media next
    color = $text
    font_size = 16
    font_family = $icons
    position = -40, 112
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/fr-media playicon
    onclick = ~/.local/bin/fr-media toggle
    color = $accent
    font_size = 16
    font_family = $icons
    position = -70, 112
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:2000] ~/.local/bin/fr-media previcon
    onclick = ~/.local/bin/fr-media prev
    color = $text
    font_size = 16
    font_family = $icons
    position = -100, 112
    halign = right
    valign = bottom
}

# petunjuk kecil di atas
label {
    monitor =
    text = 󰌾  Terkunci
    color = rgba(230, 234, 242, 0.45)
    font_size = 12
    font_family = $icons
    position = 0, -36
    halign = center
    valign = top
}
