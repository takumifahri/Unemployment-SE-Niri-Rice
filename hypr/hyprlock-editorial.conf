# FR Navy — hyprlock "editorial" (dipilih lewat fr-lockstyle)
# Jam besar bertumpuk di kiri bawah, login minimal di kanan bawah,
# tengah dibiarkan kosong supaya wallpaper yang jadi pusat perhatian.
# Wallpaper: ~/.config/hypr/lock.png (panel kontrol → Wallpaper → Lockscreen)
# Gaya lain: hyprlock-center.conf (fr-lockstyle center)
# Catatan: di hyprlock "##" = karakter "#"

$text   = rgba(240, 243, 248, 1.0)
$muted  = rgba(240, 243, 248, 0.70)
$faint  = rgba(240, 243, 248, 0.58)
$accent = rgba(110, 168, 254, 1.0)
$teal   = rgba(127, 209, 185, 1.0)
$urgent = rgba(242, 122, 122, 1.0)
$shadow = rgba(0, 0, 0, 0.45)
$font   = Inter
$icons  = JetBrainsMono Nerd Font

general {
    hide_cursor = false   # kursor tampil supaya tombol media bisa diklik
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = soft, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 7, soft
    animation = fadeOut, 1, 4, soft
    animation = inputFieldDots, 1, 2, soft
}

background {
    monitor =
    path = ~/.config/hypr/lock.png
    color = rgba(11, 15, 23, 1.0)
    blur_passes = 2
    blur_size = 5
    noise = 0.015
    contrast = 0.92
    brightness = 0.74
    vibrancy = 0.25
}

# ═══ kiri atas: status kunci ════════════════════════════
label {
    monitor =
    text = <span foreground="##6EA8FE">󰌾</span>   Terkunci
    color = $muted
    font_size = 13
    font_family = $icons
    shadow_passes = 1
    shadow_color = $shadow
    position = 96, -56
    halign = left
    valign = top
}

# ═══ kiri atas: media yang sedang diputar (hilang sendiri kalau tidak ada) ═══
# sumber: MPRIS (Spotify, Feishin, YouTube/Netflix di browser, mpv, …) lewat fr-media
image {
    monitor =
    path = ~/.cache/fr-media/none.png
    reload_cmd = ~/.local/bin/fr-media art
    reload_time = 3
    size = 84
    rounding = 16
    border_size = 0
    position = 96, -104
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:2000] ~/.local/bin/fr-media title
    color = $text
    font_size = 16
    font_family = Inter SemiBold
    shadow_passes = 2
    shadow_color = $shadow
    position = 198, -106
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:2000] ~/.local/bin/fr-media sub
    color = $muted
    font_size = 12
    font_family = $font
    shadow_passes = 1
    shadow_color = $shadow
    position = 198, -134
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:2000] ~/.local/bin/fr-media previcon
    onclick = ~/.local/bin/fr-media prev
    color = $text
    font_size = 17
    font_family = $icons
    position = 198, -160
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/fr-media playicon
    onclick = ~/.local/bin/fr-media toggle
    color = $accent
    font_size = 17
    font_family = $icons
    position = 230, -160
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:2000] ~/.local/bin/fr-media nexticon
    onclick = ~/.local/bin/fr-media next
    color = $text
    font_size = 17
    font_family = $icons
    position = 262, -160
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/fr-media progress
    color = $accent
    font_size = 11
    font_family = $icons
    position = 300, -165
    halign = left
    valign = top
}
# ═══ kanan atas: baterai · wifi ═════════════════════════
label {
    monitor =
    text = cmd[update:60000] b=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); s=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1); w=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | grep '^yes' | cut -d: -f2); out=""; [ -n "$w" ] && out="󰖩  $w"; if [ -n "$b" ]; then [ "$s" = "Charging" ] && i="󰂄" || i="󰁹"; [ -n "$out" ] && out="$out      "; out="$out$i  $b%"; fi; echo "$out"
    color = $muted
    font_size = 13
    font_family = $icons
    shadow_passes = 1
    shadow_color = $shadow
    position = -96, -56
    halign = right
    valign = top
}

# ═══ kiri bawah: jam bertumpuk ══════════════════════════
# jam
label {
    monitor =
    text = cmd[update:1000] date +%H
    color = $text
    font_size = 150
    font_family = Inter ExtraBold
    shadow_passes = 3
    shadow_size = 8
    shadow_color = $shadow
    position = 88, 318
    halign = left
    valign = bottom
}
# menit (aksen)
label {
    monitor =
    text = cmd[update:1000] date +%M
    color = $accent
    font_size = 150
    font_family = Inter ExtraBold
    shadow_passes = 3
    shadow_size = 8
    shadow_color = $shadow
    position = 88, 150
    halign = left
    valign = bottom
}
# garis aksen kecil
shape {
    monitor =
    size = 56, 5
    color = $accent
    rounding = -1
    position = 96, 128
    halign = left
    valign = bottom
}
# tanggal
label {
    monitor =
    text = cmd[update:60000] LC_TIME=id_ID.UTF-8 date +"%A, %-d %B"
    color = $text
    font_size = 21
    font_family = Inter SemiBold
    shadow_passes = 2
    shadow_color = $shadow
    position = 96, 82
    halign = left
    valign = bottom
}
# ═══ kanan bawah: login minimal ═════════════════════════
# foto profil (~/.face, diatur dari panel kontrol → Profil)
image {
    monitor =
    path = ~/.face
    size = 76
    rounding = -1
    border_size = 3
    border_color = $accent
    position = -96, 216
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:0] n=$(cat ~/.config/fr-profile/name 2>/dev/null); [ -n "$n" ] || n="$USER"; echo "Halo, $n"
    color = $text
    font_size = 18
    font_family = Inter SemiBold
    shadow_passes = 2
    shadow_color = $shadow
    position = -96, 168
    halign = right
    valign = bottom
}
label {
    monitor =
    text = Ketik password untuk membuka
    color = $faint
    font_size = 12
    font_family = $font
    shadow_passes = 1
    shadow_color = $shadow
    position = -96, 146
    halign = right
    valign = bottom
}
input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    rounding = -1
    outer_color = rgba(255, 255, 255, 0.14)
    inner_color = rgba(11, 15, 23, 0.55)
    font_color = $text
    font_family = $font
    check_color = $accent
    fail_color = $urgent
    capslock_color = rgba(242, 196, 109, 1.0)
    placeholder_text = <span fgalpha="45%">••••••••</span>
    fail_text = <span foreground="##F27A7A">Salah — coba lagi ($ATTEMPTS)</span>
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.35)
    position = -96, 76
    halign = right
    valign = bottom
}
