[General]
# File ini ditulis ulang oleh `fr-sddm sync` (warna, nama, foto, wallpaper).
# Baris lain yang kamu ubah sendiri tetap dipertahankan.

# palet: sama dengan ~/.config/fr-theme/themes.json (bawaan: navy)
theme="navy"
bg="#0B0F17"
surface="#121826"
surface2="#1A2233"
border="#24304A"
text="#E6EAF2"
muted="#8A96AD"
accent="#6EA8FE"
accent2="#7FD1B9"
warn="#F2C46D"
urgent="#F27A7A"

# "image" = backgrounds/lock.* (salinan ~/.config/hypr/lock.png)
# "video" = backgrounds/video.* (atur lewat: fr-sddm video <file>)
backgroundType="image"
background="backgrounds/lock.png"
video=""
# efek wallpaper, mirip background{} hyprlock editorial
# blur 0..1 · dim 0..1 (0.3 ≈ brightness 0.7) · saturation -1..1
blur="0.45"
dim="0.3"
saturation="0.1"

# profil (dari fr-avatar); cuma dipakai buat akun displayUser
displayUser=""
displayName=""
avatar=""

font="Inter"
iconFont="JetBrainsMono Nerd Font"
locale="id_ID"
